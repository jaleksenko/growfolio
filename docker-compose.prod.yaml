services:
  nginx:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - main_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
    command: "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env.prod
    networks:
      - main_network
  
  redis:
    image: redis:6.2
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - main_network

networks:
  main_network:
