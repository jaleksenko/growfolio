services:
  nginx:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - main_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
    volumes:
      - .:/app
    command: "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    networks:
      - main_network
  
  
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # for local connection at localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network

  
  redis:
    image: redis:6.2
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - main_network

volumes:
  postgres_data:


networks:
  main_network:
